name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Verify package content
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e 'const p=require("/tmp/pack.json")[0]; for(const name of ["extensions/docs-sync/index.ts","extensions/docs-sync/mirror.ts","README.md","LICENSE"]) if(!p.files.some(f=>f.path===name || f.path.includes(name))) throw Error("Missing "+name); if(p.files.some(f=>/^(tests\/|\.github\/|tsconfig)/.test(f.path))) throw Error("Dev-only file in package: "+f.path)'
      - name: Typecheck and test from the tagged tree
        run: |
          npm ci
          npm run typecheck
          npm test

  publish-gpr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@raffaelenatale'
      - name: Publish to GitHub Packages
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
